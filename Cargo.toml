[package]
name = "artiqwest"
version = "0.6.0"
edition = "2024"
description = "A simple client for making http request over Tor with Arti."
license = "MIT"
repository = "https://github.com/basic-automation/artiqwest"
readme = "README.md"
keywords = ["tor", "http", "request", "client", "SOCKS"]
categories = ["network-programming", "web-programming::http-client"]

[dependencies]
hyper = { version = "1.12.0", features = ["full"] }
bytes = "1.12.1"
anyhow = "1.0.104"
arti-client = { version = "0.47.0", features = ["full", "static"] }
http-body-util = "0.1.5"
hyper-util = { version = "0.1.21", features = ["full"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-native-tls = "0.3.1"
tor-rtcompat = { version = "0.47.0", features = ["full", "tokio", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
serde_json = "1.0.154"
reqwest = "0.13.5"

futures-util = { version = "0.3.34", default-features = false, features = [
        "sink",
        "std",
] }

tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
onyums = "0.6.0"
axum = { version = "0.8.9", features=["ws"] }
rand = "0.10.3"
serial_test = "4.0"
rustls = "0.23"
