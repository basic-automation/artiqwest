name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: build, clippy & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install OpenSSL headers (native-tls)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # The `test_get` / `test_post` / `test_ws` integration tests bootstrap a
      # real Tor client and reach live onion/external services, so they are
      # marked `#[ignore]`. Run those locally with `cargo test -- --ignored`.
      - name: Test
        run: cargo test --locked --lib

      # The doc examples dial the live network too, but they are marked
      # `no_run`, so this compiles every one of them without executing any.
      # Without this step they rot unnoticed: all 7 were broken (three would
      # not even compile) before it was added.
      - name: Doc tests
        run: cargo test --locked --doc

  fmt:
    name: rustfmt (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # rustfmt.toml uses unstable options (group_imports, imports_layout,
      # reorder_impl_items), which require a nightly rustfmt.
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all --check
